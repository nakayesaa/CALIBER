[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "PIE", "UP"]
ignore = ["UP047"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
