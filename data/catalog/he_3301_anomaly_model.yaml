model_id: he-3301-isolation-forest-v1
model_version: 1.0.0
input_pipeline_id: he-3301-hourly-features-v1
random_seed: 3301
expected_feature_count: 28
split:
  fit_fraction: 0.60
  minimum_fit_rows: 720
  minimum_calibration_rows: 168
scaler:
  quantile_range: [25.0, 75.0]
  with_centering: true
  with_scaling: true
  unit_variance: false
estimator:
  n_estimators: 400
  max_samples: 256
  max_features: 1.0
  bootstrap: false
  n_jobs: -1
calibration:
  anomaly_quantile: 0.99
  median_normalized_score: 10.0
  threshold_normalized_score: 50.0
  exponent_clip: 60.0
drivers:
  maximum_drivers: 4
  included_feature_suffixes:
    - __value
    - __delta_1h
    - __mean_6h
    - __std_6h
    - __mean_24h
    - __std_24h
    - __trend_6h
evaluation:
  normal_phases: [HEALTHY_BASELINE]
  degradation_phases: [EARLY_DEGRADATION, PERSISTENT_ALARM, ACUTE_ESCALATION]
  trip_phase: TRIP_AND_SHUTDOWN
  recovery_phases: [POST_REPAIR_MONITORING, STABLE_RECOVERY]
validation:
  healthy_end_exclusive: '2026-02-26T00:00:00+07:00'
  exclusion_gap_hours: 24
  minimum_holdout_rows: 168
  maximum_healthy_exceedance: 0.05
  isolation_at: '2026-05-21T09:00:00+07:00'
  recovery_start: '2026-05-22T22:00:00+07:00'
  sustained_hours: 6
