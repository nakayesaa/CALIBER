name: Quality and security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock

      - name: Install application dependencies
        run: |
          npm ci
          python -m venv .venv
          .venv/bin/pip install -r services/api/requirements.lock

      - name: Run code and security checks
        run: make check

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Audit Python dependencies
        run: |
          .venv/bin/pip install pip-audit==2.10.1
          .venv/bin/pip-audit -r services/api/requirements.lock
